name: Build iOS IPA

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar archivos y crear proyecto iOS
        run: |
          # 1. Si se subió la carpeta SpanishTetris-iOS, mover su contenido a la raíz
          if [ -d "SpanishTetris-iOS" ]; then
            echo "--> Detectada subcarpeta SpanishTetris-iOS. Extrayendo archivos..."
            cp -r SpanishTetris-iOS/* . 2>/dev/null || true
          fi

          # 2. Crear package.json si no existe
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # 3. Instalar Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # 4. Asegurar carpeta www
          mkdir -p www

          # Si no existe www/index.html, buscar cualquier archivo html y copiarlo
          if [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find . -iname "*.html" ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "./www/*" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              echo "--> Archivo HTML encontrado en: $HTML_FILE"
              HTML_DIR=$(dirname "$HTML_FILE")
              cp -r "$HTML_DIR"/* www/ 2>/dev/null || true
              if [ ! -f "www/index.html" ]; then
                cp "$HTML_FILE" www/index.html
              fi
            fi
          fi

          # 5. Crear configuración de Capacitor si no existe
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.example.spanishtetrischallenge",
            "appName": "Spanish Tetris",
            "webDir": "www"
          }
          EOF
          fi

          # 6. Generar proyecto iOS nativo y sincronizar
          npx cap add ios
          npx cap sync ios

      - name: Compilar App con Xcode
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r SpanishTetris.ipa Payload

      - name: Subir el IPA a los resultados
        uses: actions/upload-artifact@v4
        with:
          name: SpanishTetris-iOS-IPA
          path: SpanishTetris.ipa
