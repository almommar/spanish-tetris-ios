name: Build iOS IPA

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar archivos y crear proyecto iOS
        run: |
          # 1. Crear package.json si no existe
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # 2. Instalar Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # 3. Asegurar carpeta www con el juego
          mkdir -p www
          if [ -f "index.html" ]; then
            rsync -av --exclude 'www' --exclude '.git' --exclude '.github' --exclude 'node_modules' ./ www/
          fi

          # 4. Crear configuración de Capacitor si no existe
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.example.spanishtetrischallenge",
            "appName": "Spanish Tetris",
            "webDir": "www"
          }
          EOF
          fi

          # 5. Generar proyecto iOS nativo y sincronizar
          npx cap add ios
          npx cap sync ios

      - name: Compilar App con Xcode
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r SpanishTetris.ipa Payload

      - name: Subir el IPA a los resultados
        uses: actions/upload-artifact@v4
        with:
          name: SpanishTetris-iOS-IPA
          path: SpanishTetris.ipa
